# enable display drivers
CONFIG_ZMK_DISPLAY=y

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

# enable NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# display + battery display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable SPI
CONFIG_SPI=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# WS2812 strip SPI driver included in Zephyr 4.1
#CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
#CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y -- rule out latency quantum that may tie to the 50ms blackouts
#CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

CONFIG_ZMK_POINTING=y

# EBS Split Transport
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
# >= highest id + 1, for battery reporting/fetching
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
# = # of keys in keymap
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=64
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ESB_TX_FIFO_SIZE=8

# Pin a single RF channel since dongle nRF5 controllers cant retune while radio is in RX
# and desync occurs between peripherals and the dongle
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_COUNT=1
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_MIN=77
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_STEP=0

# Pin non-hop values since current chop config messes up retry values
CONFIG_ZMK_SPLIT_ESB_RETRY_KEY_POSITION=3
CONFIG_ZMK_SPLIT_ESB_RETRY_SENSOR_EVENT=2
CONFIG_ZMK_SPLIT_ESB_RETRY_BATTERY_EVENT=1
CONFIG_ZMK_SPLIT_ESB_RETRY_CMD=1

CONFIG_INPUT=y
CONFIG_GPIO=y

# ESB TX & input path need greater stack size
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=8192
CONFIG_INPUT_QUEUE_MAX_MSGS=512

# ESB Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Debugging
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y

# reducing unecessary dongle logs
CONFIG_ZMK_LOG_LEVEL=2

# increase log bffer sixes and reduce sleep ms to remove extraneous logs
#CONFIG_LOG_BUFFER_SIZE=32768
#CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
#CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# strip ansi colors in logs to reduce log size
#CONFIG_LOG_BACKEND_SHOW_COLOR=n

# give the cat /dev/ttyACMx captures time to attach
#CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
